[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "pi-dspy-gepa-workflows-runtime"
version = "0.1.0"
description = "Fixed DSPy campaign worker and standalone GEPA adapter"
requires-python = "==3.13.13"
dependencies = ["dspy==3.3.1", "gepa==0.1.4"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.12.12"]

[tool.hatch.build.targets.wheel]
packages = ["python/pi_dspy_gepa"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["python"]
testpaths = ["python/tests"]
